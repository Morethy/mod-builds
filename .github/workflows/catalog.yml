name: catalog
run-name: catalog ${{ inputs.build || vars.CATALOG_BUILD }} ${{ inputs.abi || 'arm64-v8a' }}
# Compile v2's store, ahead of the players: every native mod in Horizon's catalog
# (horizon-rust.github.io/horizon-mods, kind native-mod), each version for the build's game, built once
# for one game build (a Nightly) and ABI beside that build's base (store-base.yml, which runs first and
# puts the build in builds.json), so a game finds it in mods-<build>/index.json and never asks the Compile
# service for it (scripts/store.py).
#
# The mods are built as mod.yml builds one: in the sandbox, with a token that can only read; a job that
# runs nothing of them publishes. A mod already in the index, or failed there for good, is not built
# again; run it again after the catalog grows.
on:
  # Every three hours for the release players have (the repository variable CATALOG_BUILD): the catalog grows
  # every day, and a version no run built yet is one each player waits for a build of.
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: The game build (its full commit), in the store's builds.json
        required: true
      abi:
        description: The ABI to build for
        default: arm64-v8a
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
    env:
      BUILD: ${{ inputs.build || vars.CATALOG_BUILD }}
      ABIS: ${{ inputs.abi || 'arm64-v8a' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: plan
        name: What the build lacks
        run: python3 scripts/store.py plan plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 1
  # Four runners, each a quarter of the plan (every fourth job): a full catalog took 35-40 minutes on one.
  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 300
    env:
      BUILD: ${{ inputs.build || vars.CATALOG_BUILD }}
      ABI: ${{ inputs.abi || 'arm64-v8a' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: This runner's quarter of the plan
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 -I -c 'import json,os,sys; p=json.load(open("plan.json")); n=int(os.environ["SHARD"]); json.dump(p[n::4], open("plan.json","w"), indent=1); print(len(p[n::4]), "of", len(p))'
      - name: The build's profile
        run: python3 scripts/store.py env
      - name: Make room
        run: bash scripts/room.sh
      - uses: actions/cache/restore@v4
        with:
          key: store2-${{ inputs.build || vars.CATALOG_BUILD }}-${{ inputs.abi || 'arm64-v8a' }}-${{ env.PROFILE }}
          # A base from before store2 (built in the runner's environment: each mod's build is slower beside it).
          restore-keys: store-${{ inputs.build || vars.CATALOG_BUILD }}-${{ inputs.abi || 'arm64-v8a' }}-${{ env.PROFILE }}
          fail-on-cache-miss: true
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: The mods, as the catalog has them
        run: python3 scripts/store.py fetch plan.json mods
      - name: Build
        env:
          SANDBOX_SECONDS: '17000'
        run: bash scripts/sandbox.sh plan.json mods result
      # What was built before a stop goes up too: the next run plans only the rest.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.shard }}
          path: result/
          retention-days: 1
          compression-level: 1
  publish:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: index-${{ inputs.build || vars.CATALOG_BUILD }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BUILD: ${{ inputs.build || vars.CATALOG_BUILD }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: result/
      - name: The answers
        run: python3 scripts/store.py publish result
      - name: The index
        run: python3 scripts/store.py index
